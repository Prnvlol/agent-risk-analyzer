name: Rule request
description: Suggest a new vulnerability rule or an improvement to an existing rule.
title: "[Rule]: "
labels: ["enhancement", "rule"]
body:
  - type: markdown
    attributes:
      value: Use this for false negatives, false positives, and new AI agent risk categories ARA should detect.
  - type: textarea
    id: risk
    attributes:
      label: Risk pattern
      description: What should ARA detect or handle differently?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Minimal example
      description: Provide a realistic code/config sample. Remove secrets and private data.
      render: python
    validations:
      required: true
  - type: dropdown
    id: framework
    attributes:
      label: Framework or surface
      options:
        - LangChain
        - CrewAI
        - AutoGen
        - MCP
        - Generic Python
        - Config file
        - Logging/reporting
        - Other
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Suggested severity
      options:
        - Critical
        - High
        - Medium
        - Low
        - Not sure
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Links to docs, advisories, MITRE ATLAS, OWASP, or real incidents.
    validations:
      required: false
